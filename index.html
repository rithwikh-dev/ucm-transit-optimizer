<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UC Merced Transit Planner</title>

    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div class="app-container">
        
    <h1>UC Merced Transit Planner</h1>

    <div class = "input-group">
        <label for="stop-selector">Select your Stop:</label>
        <select id="stop-selector">
            <option value="University Transit Center">University Transit Center</option>
            <option value="R St. Village Apartments">R St. VIllage Apartments</option>
            <option value ="Amtrak Station">Amtrak Station</option>
            <option value ="Merced College: The Bus Terminal">Merced College The Bus Terminal</option>
        </select>
    </div>

    <p>Check browser console (F12) to see the transit data results!</p>

    </div>

    <!-- links main JavaScript app as a module -->
    <script type="module" src="./js/app.js"></script>
    
</body>
</html>
