<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>University of California: Merced Transit Planner</title>

    <link rel="stylesheet" href="./css/style.css">
</head>
<body>
    <div class="app-container">
        
    <h1>University of California: Merced Transit Planner</h1>

    <div class ="clock-display">
        Current Time: <span id ="live-clock">--:-- --</span>
    </div>

<!-- User input for current stop!-->

    <div class = "selector-group">
        <label class = "selector-label" for="stop-selector">Which stop are you currently at?:</label>
        <select id="stop-selector">
        </select>
    </div>

<!--User input for destination stop-->  
    
    <div class = "selector-group">
        <label class="selector-label" for="destination-selector">Which stop is your destination?:</label>
        <select id="destination-selector">
        </select>
    </div>

    <div class = "results-section">

        <h2 class ="upcoming-departures">Upcoming Departures:</h2>
        <ul id ="bus-list"></ul>
        
    </div>

    <div class = "test-panel" style = "margin-top: 15px; padding: 12px; border: 2px dashed #002855; border-radius: 12px; background-color: #f8fafc;">
        <label style = "font-weight: bold; display: block; margin-bottom: 6px;color: #002855;">
            Time Travel: <span id = "slider-time-text" style="color: #059669;">Live Clock</span>
        </label>
        <input type = "range" id = "time-slider" min = "360" max = "1380" step = "5" style = "width: 100%; cursor: pointer;">
        <button id="reset-time-btn" style="margin-top: 8px; width: 100%; padding : 6px; font-weight: 600; background-color: #002855; color: white; border: none; border-radius: 6px;cursor: pointer;">Reset to Live Time </button>
    </div>

    </div>

    <!-- links main JavaScript app as a module -->
    <script type="module" src="./js/app.js"></script>
    
</body>
</html>
